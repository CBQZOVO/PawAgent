# 双平台出包：macOS(arm64) + Windows(x64)，产物压为单文件 zip 上传 Artifact；
# 推 v* tag 时自动创建 GitHub Release 并附带双平台压缩包。
# 触发：手动 workflow_dispatch / 推 v* tag。
# 说明：
# - macOS 走 build-app.sh（PAW_NO_INSTALL=1 跳过本机安装），用 ditto 打包保留 .app 内部符号链接与权限；
# - Windows 走 build-app.ps1，用 Compress-Archive 压成单文件 zip；
# - 产物未签名：Windows 首次运行会有 SmartScreen 提示，macOS 需右键 → 打开绕过 Gatekeeper。
name: build-app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # arm64
            script: ./build-app.sh
            artifact: Paw-macos-arm64
            archive-path: /tmp/paw-pack/Paw-macos-arm64.zip
          - os: windows-latest        # x64
            script: ./build-app.ps1
            artifact: Paw-windows-x64
            archive-path: pack/Paw-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并压缩（macOS）
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.script }}
          ditto -c -k --sequesterRsrc --keepParent /tmp/paw-pack/Paw-darwin-arm64/Paw.app "${{ matrix.archive-path }}"
        env:
          PAW_NO_INSTALL: '1'

      - name: 打包并压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.script }}
          Compress-Archive -Path pack/Paw-win32-x64 -DestinationPath "${{ matrix.archive-path }}" -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive-path }}
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
