# 双平台出包：macOS(arm64) + Windows(x64)，产物压为单文件 zip 上传 Artifact；
# 推 v* tag 时自动创建 GitHub Release 并附带双平台压缩包。
# 触发：手动 workflow_dispatch / 推 v* tag。
# 说明：
# - macOS 走 build-app.sh（PAW_NO_INSTALL=1 跳过本机安装），用 ditto 打包保留 .app 内部符号链接与权限；
# - Windows 走 build-app.ps1，用 Compress-Archive 压成单文件 zip；
# - 产物未签名：Windows 首次运行会有 SmartScreen 提示，macOS 需右键 → 打开绕过 Gatekeeper。
name: build-app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # arm64
            script: ./build-app.sh
            target: macos-arm64
            archive-dir: /tmp/paw-pack
          - os: windows-latest        # x64
            script: ./build-app.ps1
            target: windows-x64
            archive-dir: pack
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 校验并提取版本号
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkgVer = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const ref = process.env.GITHUB_REF || "";
            const refName = process.env.GITHUB_REF_NAME || "";
            if (ref.startsWith("refs/tags/v")) {
              const tagVer = refName.slice(1);
              if (pkgVer !== tagVer) {
                console.error(`::error::Tag (${refName}) 与 package.json version (${pkgVer}) 不一致，请先更新 package.json 再打 tag`);
                process.exit(1);
              }
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=v${pkgVer}\n`);
            console.log(`→ 构建版本：v${pkgVer}`);
          '

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并压缩（macOS）
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.script }}
          ditto -c -k --sequesterRsrc --keepParent /tmp/paw-pack/Paw-darwin-arm64/Paw.app "${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip"
        env:
          PAW_NO_INSTALL: '1'

      - name: 打包并压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.script }}
          Compress-Archive -Path pack/Paw-win32-x64 -DestinationPath "${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip" -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ env.APP_VERSION }}-${{ matrix.target }}
          path: ${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
