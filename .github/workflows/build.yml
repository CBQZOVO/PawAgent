# 双平台出包：macOS(arm64) + Windows(x64)，产物压为单文件 zip 上传 Artifact；
# 支持在 GitHub Actions 页面点击「Run workflow」直接输入版本号一键构建并自动发 Release，
# 也支持推 v* tag 自动触发。无需手动修改仓库里的 package.json 版本号。
# 说明：
# - macOS 走 build-app.sh（PAW_NO_INSTALL=1 跳过本机安装），用 ditto 打包保留 .app 内部符号链接与权限；
# - Windows 走 build-app.ps1，用 Compress-Archive 压成单文件 zip；
# - 产物未签名：Windows 首次运行会有 SmartScreen 提示，macOS 需右键 → 打开绕过 Gatekeeper。
name: build-app

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0-rc.2 或 1.0.0；留空则读取 package.json 版本）'
        required: false
        type: string
      create_release:
        description: '构建完成后自动创建 GitHub Release（并自动打 v<版本号> tag）'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # arm64
            script: ./build-app.sh
            target: macos-arm64
            archive-dir: /tmp/paw-pack
          - os: windows-latest        # x64
            script: ./build-app.ps1
            target: windows-x64
            archive-dir: pack
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 解析并注入构建版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            let ver = (process.env.INPUT_VERSION || "").trim().replace(/^v/i, "");
            if (!ver && (process.env.GITHUB_REF || "").startsWith("refs/tags/v")) {
              ver = (process.env.GITHUB_REF_NAME || "").replace(/^v/i, "");
            }
            if (!ver) ver = pkg.version;
            if (!/^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/.test(ver)) {
              console.error(`::error::非法版本号：${ver}（示例：1.0.0 或 1.0.0-rc.2）`);
              process.exit(1);
            }
            if (pkg.version !== ver) {
              pkg.version = ver;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
            const tag = `v${ver}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${tag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${ver}\ntag=${tag}\n`);
            console.log(`→ 构建版本：${ver}（tag: ${tag}）`);
          '

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并压缩（macOS）
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.script }}
          ditto -c -k --sequesterRsrc --keepParent /tmp/paw-pack/Paw-darwin-arm64/Paw.app "${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip"
        env:
          PAW_NO_INSTALL: '1'

      - name: 打包并压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.script }}
          Compress-Archive -Path pack/Paw-win32-x64 -DestinationPath "${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip" -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ env.APP_VERSION }}-${{ matrix.target }}
          path: ${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}.zip
          retention-days: 14

  release:
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist-artifacts/*.zip
          prerelease: ${{ contains(needs.package.outputs.tag, '-') }}
          generate_release_notes: true
