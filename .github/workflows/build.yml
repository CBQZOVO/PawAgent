# 双平台出包：macOS(arm64) .dmg + Windows(x64) Setup.exe 安装包，上传 Artifact；
# 支持在 GitHub Actions 页面点击「Run workflow」直接输入版本号一键构建并自动发 Release，
# 也支持推 v* tag 自动触发。无需手动修改仓库里的 package.json 版本号。
# 说明：
# - macOS 走 build-app.sh（PAW_NO_INSTALL=1 跳过本机安装），用 hdiutil 打包带 Applications 快捷方式的 .dmg（ULMO/lzma 压缩）；
# - Windows 走 build-app.ps1，用 Inno Setup（desktop/scripts/installer.iss）生成 Setup.exe 安装包；
# - 产物未签名：Windows 首次运行会有 SmartScreen 提示，macOS 需右键 → 打开绕过 Gatekeeper。
name: build-app

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0-rc.2 或 1.0.0；留空则读取 package.json 版本）'
        required: false
        type: string
      create_release:
        description: '构建完成后自动创建 GitHub Release（并自动打 v<版本号> tag）'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # arm64
            script: ./build-app.sh
            target: macos-arm64
            archive-dir: /tmp/paw-pack
            ext: .dmg
          - os: windows-latest        # x64
            script: ./build-app.ps1
            target: windows-x64-setup
            archive-dir: pack
            ext: .exe
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 解析并注入构建版本号
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            let ver = (process.env.INPUT_VERSION || "").trim().replace(/^v/i, "");
            if (!ver && (process.env.GITHUB_REF || "").startsWith("refs/tags/v")) {
              ver = (process.env.GITHUB_REF_NAME || "").replace(/^v/i, "");
            }
            if (!ver) ver = pkg.version;
            if (!/^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/.test(ver)) {
              console.error(`::error::非法版本号：${ver}（示例：1.0.0 或 1.0.0-rc.2）`);
              process.exit(1);
            }
            if (pkg.version !== ver) {
              pkg.version = ver;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
            const tag = `v${ver}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${tag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${ver}\ntag=${tag}\n`);
            console.log(`→ 构建版本：${ver}（tag: ${tag}）`);
          '

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并生成 DMG（macOS）
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.script }}
          DMG_STAGE="/tmp/paw-dmg"
          rm -rf "$DMG_STAGE" && mkdir -p "$DMG_STAGE"
          cp -R /tmp/paw-pack/Paw-darwin-arm64/Paw.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Paw" -srcfolder "$DMG_STAGE" -ov -format ULMO \
            "${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}${{ matrix.ext }}"
        env:
          PAW_NO_INSTALL: '1'

      - name: 打包并生成安装包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ matrix.script }}
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $ver = "${{ steps.ver.outputs.version }}"
          $outBase = "Paw-${{ env.APP_VERSION }}-${{ matrix.target }}"
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DSourceDir=$PWD\pack\Paw-win32-x64" `
            "/DOutputDir=$PWD\pack" `
            "/DOutputBaseFilename=$outBase" `
            "desktop\scripts\installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "✗ Inno Setup 打包失败" }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Paw-${{ env.APP_VERSION }}-${{ matrix.target }}
          path: ${{ matrix.archive-dir }}/Paw-${{ env.APP_VERSION }}-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 14

  release:
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 生成 Release 说明（取上次 tag 至今变更）
        run: |
          node desktop/scripts/gen-release-notes.mjs \
            --tag "${{ needs.package.outputs.tag }}" \
            --artifacts dist-artifacts \
            --out release-notes.md

      - name: 创建并推送 Git Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ needs.package.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "Release $TAG"
          git push -f origin "refs/tags/$TAG"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Paw ${{ needs.package.outputs.tag }}
          tag_name: ${{ needs.package.outputs.tag }}
          body_path: release-notes.md
          files: dist-artifacts/*
          prerelease: ${{ contains(needs.package.outputs.tag, '-') }}
